[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sikt-mini-lakehouse"
version = "0.1.0"
description = "SIKT Mini Financial Data Lakehouse: CDC from SIMDA MySQL and e-budgeting PostgreSQL into a governed, dbt-built star schema for APBD realization."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "mysql-replication>=1.0,<2",
  "pymysql>=1.1,<2",
  "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dbt = [
  "dbt-core>=1.8,<1.9",
  "dbt-postgres>=1.8,<1.9",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: needs the docker compose stack running (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".venv-airflow", ".airflow", "dbt/target", "dbt/logs", "sources"]
