# SIKT Mini Financial Data Lakehouse — local stack.
#
# Mirrors the production SIKT architecture described in the PRD with real,
# locally runnable components:
#
#   MySQL      -> SIMDA source, binary log in ROW format (real CDC source)
#   PostgreSQL -> e-budgeting source (real logical-replication slot)
#              + `dwh` database where dbt builds the star schema
#   MinIO      -> S3-compatible immutable landing zone (versioned bucket)
#   Metabase   -> consumption layer, provisioned through its REST API
#
# Production equivalents that stay documented rather than simulated:
#   Debezium + Kafka (CDC transport), MWAA (orchestration), Amazon S3 (landing),
#   BigQuery/Redshift (warehouse). See docs/architecture.md.

services:
  simda-mysql:
    image: mysql:8.4
    container_name: sikt-mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      # FULL metadata embeds column names in every row event — the same
      # setting Debezium needs to map columns without guessing.
      - --binlog-row-metadata=FULL
    environment:
      MYSQL_ROOT_PASSWORD: sikt-root
      MYSQL_DATABASE: simda
      MYSQL_USER: simda
      MYSQL_PASSWORD: sikt-simda
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psikt-root"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  ebudget-postgres:
    image: postgres:16
    container_name: sikt-postgres
    # logical writes need wal_level=logical for the real replication slot
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sikt-postgres
      POSTGRES_DB: ebudget
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql/data

  # S3-compatible landing zone. MinIO retired free public images in 2025, so the
  # landing uses LocalStack's S3 implementation instead — same boto3 client, same
  # versioning and lifecycle semantics, documented as "MinIO/S3 in production".
  landing-s3:
    image: localstack/localstack:3
    container_name: sikt-landing
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: sikt
      AWS_SECRET_ACCESS_KEY: sikt-landing-secret
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - landing-data:/var/lib/localstack

  metabase:
    image: metabase/metabase:latest
    container_name: sikt-metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      # 3000 is taken by a local dev server; the API setup script targets 3300
      - "3300:3000"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - ebudget-postgres

volumes:
  mysql-data:
  pg-data:
  landing-data:
  metabase-data:
